[package]
name = "steam_activity_sniper"
version = "0.1.0"
edition = "2024"
description = "Monitors Steam profiles via Tampermonkey and graphs each user's top played games over time."
license = "MIT"

[package.metadata.packager]
product-name = "Steam Activity Sniper"
identifier = "com.steamactivitysniper.app"
formats = ["nsis"]
before-packaging-command = "cargo build --release"
out-dir = "./target/release"
binaries-dir = "./target/release"
binaries = [{ path = "steam_activity_sniper", main = true }]
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/256x256.png",
  "icons/icon.ico",
]
resources = [
  "README.md",
]

[package.metadata.packager.nsis]
installMode = "currentUser"
languages = ["English"]

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.36.1"
egui_plot = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
